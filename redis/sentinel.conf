# Redis Sentinel Configuration for Opera QC
# Monitors Redis master and handles automatic failover

port 26379
bind 0.0.0.0

# Sentinel identification - will be auto-generated if not set
# sentinel myid will be generated automatically

# Monitor the master Redis instance
# Format: sentinel monitor <master-name> <ip> <port> <quorum>
sentinel monitor mymaster redis-master 6379 2

# Authentication - password will be set via environment variable in Docker
# sentinel auth-pass mymaster will be set via REDIS_PASSWORD env var

# Timeouts and thresholds
sentinel down-after-milliseconds mymaster 5000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 10000

# Notification scripts (optional - for alerts)
# sentinel notification-script mymaster /var/redis/notify.sh
# sentinel client-reconfig-script mymaster /var/redis/reconfig.sh

# Deny dangerous commands
sentinel deny-scripts-reconfig yes

# Logging - use stdout for Docker compatibility
logfile ""
loglevel notice

# Performance
tcp-keepalive 60
